<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRX Mining App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background-color: #0f0f12; color: #ffffff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    .header { padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    
    /* Content Sections */
    .tab-content { display: none; padding: 20px; text-align: center; flex: 1; }
    .tab-content.active { display: block; }
    
    /* Mining Circle */
    .mine-circle { width: 160px; height: 160px; background: radial-gradient(circle, #8a2be2, #000); border-radius: 50%; margin: 30px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px #8a2be2; cursor: pointer; }
    .mine-circle:active { transform: scale(0.95); }
    .balance { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    
    /* Buttons */
    .btn { background: #ffffff; color: #000; border: none; padding: 12px 24px; border-radius: 20px; font-weight: bold; font-size: 16px; margin: 5px; cursor: pointer; }
    
    /* Bottom Navigation */
    .bottom-nav { display: flex; justify-content: space-around; background: #1a1a22; padding: 12px 0; border-top: 1px solid #2a2a35; }
    .nav-item { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }
    .nav-item.active { color: #0088cc; }
  </style>
</head>
<body>

  <div class="header">TRX Mining Hub</div>

  <!-- TAB 1: HOME (MINING) -->
  <div id="tab-home" class="tab-content active">
    <div class="balance"><span id="trx-count">0.000216</span> TRX</div>
    <div class="mine-circle" onclick="tapToEarn()">
      <span style="font-size: 40px;">💎</span>
    </div>
    <button class="btn" onclick="claimTRX()">Claim</button>
    <button class="btn">Boost</button>
  </div>

  <!-- TAB 2: WALLET -->
  <div id="tab-wallet" class="tab-content">
    <h2>💼 Wallet</h2>
    <p style="margin-top:20px;">TRX Balance: <b id="wallet-trx">0.000216</b> TRX</p>
    <button class="btn" style="margin-top:20px;">Withdraw</button>
  </div>

  <!-- TAB 3: FRIENDS -->
  <div id="tab-friends" class="tab-content">
    <h2>👥 Referral</h2>
    <p style="margin-top:20px;">Invite friends and get 10% bonus!</p>
    <button class="btn" style="margin-top:20px;" onclick="shareInvite()">Invite Friend</button>
  </div>

  <!-- TAB 4: TASKS/BOOST -->
  <div id="tab-tasks" class="tab-content">
    <h2>🚀 Boost & Tasks</h2>
    <p style="margin-top:20px;">Complete tasks to speed up mining.</p>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-home', this)">💎</button>
    <button class="nav-item" onclick="switchTab('tab-wallet', this)">👛</button>
    <button class="nav-item" onclick="switchTab('tab-friends', this)">👥</button>
    <button class="nav-item" onclick="switchTab('tab-tasks', this)">🚀</button>
  </div>

  <script>
    let count = 0.000216;
    
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function tapToEarn() {
      count += 0.00001;
      document.getElementById('trx-count').innerText = count.toFixed(6);
      document.getElementById('wallet-trx').innerText = count.toFixed(6);
    }

    function claimTRX() {
      alert('Claimed successfully!');
    }

    function shareInvite() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.openTelegramLink('https://t.me/share/url?url=https://t.me/TRXmine_X_bot/trxminer');
      }
    }
  </script>
</body>
</html>
